# ADAN NEXUS | CONNECT — self-hosted stack
#
#   cp .env.example .env      # then set SECRET_KEY and BOOTSTRAP_ADMIN_PASSWORD
#   docker compose up -d --build
#   open http://localhost:3000
#
# Only the frontend publishes a port. PostgreSQL and Redis stay on the internal
# network; the API is reachable through the Next.js same-origin proxy only.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 192M

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexus}
      DATABASE_AUTO_CREATE: "false"
      REDIS_URL: redis://redis:6379/0
      EMBEDDED_WORKER: "false"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      PUBLISH_DIR: /app/data/published
      PIPELINE_LOCK_PATH: /app/data/pipeline.lock
    volumes:
      - appdata:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.workers.worker"]
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexus}
      DATABASE_AUTO_CREATE: "false"
      REDIS_URL: redis://redis:6379/0
      EMBEDDED_WORKER: "false"
      INGESTION_ENABLED: ${INGESTION_ENABLED:-true}
      INGESTION_UPSTREAM_ONLY: ${INGESTION_UPSTREAM_ONLY:-true}
      PUBLISH_DIR: /app/data/published
      PIPELINE_LOCK_PATH: /app/data/pipeline.lock
    volumes:
      - appdata:/app/data
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  frontend:
    build:
      context: ./frontend
      args:
        API_PROXY_TARGET: http://backend:8000
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://backend:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  pgdata:
  redisdata:
  appdata:

networks:
  internal:
    driver: bridge
